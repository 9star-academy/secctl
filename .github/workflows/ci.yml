name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go vet ./...
      - run: bash -n scripts/install.sh scripts/test-linux-integration.sh
      - run: bash scripts/test-install.sh
      - name: Build release platforms
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /tmp/secctl-${target%/*}-${target#*/} ./cmd/secctl
          done
