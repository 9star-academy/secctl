name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Run Tests
        run: |
          go test -race ./...
          go vet ./...
          bash -n scripts/install.sh
          bash scripts/test-install.sh

      - name: Build Matrix Binaries
        run: |
          mkdir -p dist
          TAG="${GITHUB_REF#refs/tags/}"
          LDFLAGS="-s -w -X main.version=${TAG}"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/secctl-linux-amd64 ./cmd/secctl
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/secctl-linux-arm64 ./cmd/secctl
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/secctl-darwin-amd64 ./cmd/secctl
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/secctl-darwin-arm64 ./cmd/secctl

      - name: Generate checksums
        run: |
          (cd dist && sha256sum secctl-* > SHA256SUMS)
          if [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            cp "docs/releases/${GITHUB_REF_NAME}.md" dist/RELEASE_NOTES.md
          else
            printf 'secctl %s\n' "$GITHUB_REF_NAME" > dist/RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          body_path: dist/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/SHA256SUMS
            dist/secctl-linux-amd64
            dist/secctl-linux-arm64
            dist/secctl-darwin-amd64
            dist/secctl-darwin-arm64
          generate_release_notes: true
